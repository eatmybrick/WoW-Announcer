name: WoW Forever announcer

on:
  schedule:
    # every 5 minutes (GitHub's minimum), offset so it skips :00 and :30 when GitHub is slowest
    - cron: "3-58/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: announcer
  cancel-in-progress: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # always start from the newest main so queued runs see the latest seen.json
          ref: main

      - name: Check feed and post new items to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 wowforever_news.py --backfill 3

      - name: Save what has been posted
        run: |
          git config user.name "announcer"
          git config user.email "announcer@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen items" && git push)
